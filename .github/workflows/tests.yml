name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 11'in güvenlik desteği bitti; tüm sürümlerinde açık bildirim olduğu için
          # composer kurmayı reddeder. Paket 11'de de çalışmalı: yalnızca bu testte izin verilir.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then composer config audit.block-insecure false; fi
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        if: matrix.php == '8.4' && matrix.laravel == '12.*'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/phpunit
